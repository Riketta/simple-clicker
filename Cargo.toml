[package]
name = "simple-clicker"
version = "0.1.0"
edition = "2024"
publish = false
description = "Config-driven auto clicker that spams key and mouse actions into a target application through swappable input adapters."
license = "MIT"
# rust-version intentionally unset: the toolchain file pins the channel.

[lints.rust]
missing_docs = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "deny"
string_slice = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "warn"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optional multi-platform adapters; a plain `cargo build` (no default
# features) must always succeed on every target.
#
# versa-kbm comes from GitHub (branch `main`, pinned to an exact commit
# by Cargo.lock); update it with `cargo update -p vkbm-cli`.
rdev = { version = "0.5", optional = true }
vkbm-cli = { git = "https://github.com/Riketta/versa-kbm", branch = "main", optional = true }
# Direct re-exports of the versa-kbm stack's own types (same source and
# versions as vkbm-cli's, unified by cargo): the adapter maps domain keys
# onto HID usages and opens the HID manager itself.
hidapi = { version = "2", optional = true }
vkbm-proto = { git = "https://github.com/Riketta/versa-kbm", branch = "main", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_ToolHelp",
] }

[features]
default = ["win32"]
# Win32 window-message input sink, focus monitor, and hotkey polling
# (Windows only; the dependency is target-gated so the feature is a no-op
# elsewhere).
win32 = ["dep:windows-sys"]
# Input sink through the versa-kbm RP2040 HID device (any host platform).
versa-kbm = ["dep:vkbm-cli", "dep:hidapi", "dep:vkbm-proto"]
# Cross-platform global hotkey listener for non-Windows hosts.
hotkeys-rdev = ["dep:rdev"]

[profile.release]
lto = true
strip = true
